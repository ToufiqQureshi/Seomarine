<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Seomarine</title>
    <meta
      name="description"
      content="Seomarine: SEO and AI search tools that show you what to fix next."
    />
    <meta name="theme-color" content="#0f766e" />
    <!-- Browser auto-translate rewrites text nodes into <font> wrappers, which React then cannot remove, crashing render. -->
    <meta name="google" content="notranslate" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        try {
          var p = window.localStorage.getItem("theme-preference");
          var t;
          if (p === "light") t = "seomarine";
          else if (p === "dark") t = "seomarine-dark";
          else
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "seomarine-dark"
              : "seomarine";
          document.documentElement.setAttribute("data-theme", t);
        } catch {
          document.documentElement.setAttribute("data-theme", "seomarine");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
