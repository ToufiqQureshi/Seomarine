openapi: 3.1.0
info:
  title: Seomarine GA4 reports
  version: 1.0.0
paths:
  /api/v1/projects/{projectId}/ga4/reports/run:
    post:
      operationId: ga4RunReport
      summary: Run a GA4 report for the connected property
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: GA4 report, preserving the legacy JSON response shape
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid report request
        '401':
          description: Session is missing or invalid
        '404':
          description: Project or GA4 connection was not found
        '502':
          description: Google Analytics rejected the report or is unavailable
        '503':
          description: GA4 reporting is not configured
components:
  schemas:
    ReportRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [landing_pages, page_performance, key_events, traffic_acquisition, ecommerce_performance, site_search, audience_breakdown]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          minimum: 0
        channel:
          type: string
          enum: [organic_search, all]
          default: organic_search
        includeDate:
          type: boolean
        breakdown:
          type: string
          enum: [event, event_and_landing_page]
        acquisitionBreakdown:
          type: string
          enum: [channel_group, source_medium, campaign]
        ecommerceBreakdown:
          type: string
          enum: [item, landing_page]
        ecommerceOnlyWithTransactions:
          type: boolean
        audienceBreakdown:
          type: string
          enum: [device, country, new_vs_returning]
        comparePreviousPeriod:
          type: boolean
