openapi: 3.1.0
info:
  title: Seomarine authentication
  version: 1.0.0
paths:
  /api/auth/sign-out:
    post:
      summary: Sign out the current session
      description: >
        Hosted-only endpoint. Revokes the Better Auth session referenced by
        the signed session cookie and expires both secure and local cookie
        variants. Missing or invalid cookies are treated as signed out.
      operationId: signOut
      responses:
        "200":
          description: Session is absent or has been revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        "404":
          description: Auth mode does not enable hosted sign-in.
        "500":
          description: Session revocation failed.
        "503":
          description: Auth service is unavailable.
