openapi: 3.1.0
info:
  title: Uplumo setup health
  version: 1.0.0
paths:
  /api/health:
    get:
      summary: Check that the server answers
      description: >
        Unauthenticated. Returns only a status; it reveals no configuration.
      operationId: getSetupHealth
      responses:
        "200":
          description: The server answers.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
