<svg xmlns="http://www.w3.org/2000/svg" width="860" height="286" viewBox="0 0 860 286" role="img" aria-labelledby="title desc">
<title id="title">A practical 30-day SEO plan</title><desc id="desc">Four focused weeks: remove blockers, improve one valuable page, build local trust, and measure enquiries.</desc>
<rect width="860" height="286" rx="24" fill="#07090a"/><text x="32" y="48" fill="#c6ff3d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">UPLUMO FIELD GUIDE</text><text x="32" y="76" fill="#f2f5f3" font-family="Arial,sans-serif" font-size="18" font-weight="700">A month of focused work for a small business</text>
<g font-family="Arial,sans-serif"><rect x="32" y="96" width="188" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><text x="52" y="130" fill="#c6ff3d" font-size="13" font-weight="700">WEEK 1</text><text x="52" y="174" fill="#f2f5f3" font-size="19" font-weight="700">Remove blockers</text><text x="52" y="202" fill="#a3b0aa" font-size="13">Access, indexing, forms</text><path d="M224 167h18m-7-7 7 7-7 7" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="250" y="96" width="188" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><text x="270" y="130" fill="#c6ff3d" font-size="13" font-weight="700">WEEK 2</text><text x="270" y="174" fill="#f2f5f3" font-size="19" font-weight="700">Improve one page</text><text x="270" y="202" fill="#a3b0aa" font-size="13">Offer, proof, next step</text><path d="M442 167h18m-7-7 7 7-7 7" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="468" y="96" width="188" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><text x="488" y="130" fill="#c6ff3d" font-size="13" font-weight="700">WEEK 3</text><text x="488" y="174" fill="#f2f5f3" font-size="19" font-weight="700">Build local trust</text><text x="488" y="202" fill="#a3b0aa" font-size="13">Profile, reviews, links</text><path d="M660 167h18m-7-7 7 7-7 7" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
