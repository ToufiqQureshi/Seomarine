<svg xmlns="http://www.w3.org/2000/svg" width="860" height="286" viewBox="0 0 860 286" role="img" aria-labelledby="title desc">
<title id="title">Diagnose Search Console impressions and clicks</title><desc id="desc">Compare like-for-like data, find affected queries and pages, check position and demand, then make one measured change.</desc>
<rect width="860" height="286" rx="24" fill="#07090a"/><text x="32" y="48" fill="#c6ff3d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">UPLUMO FIELD GUIDE</text><text x="32" y="76" fill="#f2f5f3" font-family="Arial,sans-serif" font-size="18" font-weight="700">When impressions rise but clicks fall</text>
<g font-family="Arial,sans-serif"><rect x="32" y="96" width="188" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><circle cx="62" cy="128" r="16" fill="#c6ff3d"/><text x="62" y="133" text-anchor="middle" fill="#07090a" font-size="14" font-weight="700">1</text><text x="52" y="174" fill="#f2f5f3" font-size="18" font-weight="700">Compare fairly</text><text x="52" y="202" fill="#a3b0aa" font-size="13">Same dates and filters</text><path d="M224 167h18m-7-7 7 7-7 7" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="250" y="96" width="188" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><circle cx="280" cy="128" r="16" fill="#c6ff3d"/><text x="280" y="133" text-anchor="middle" fill="#07090a" font-size="14" font-weight="700">2</text><text x="270" y="174" fill="#f2f5f3" font-size="18" font-weight="700">Find the shift</text><text x="270" y="202" fill="#a3b0aa" font-size="13">Query, page, device</text><path d="M442 167h18m-7-7 7 7-7 7" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="468" y="96" width="188" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><circle cx="498" cy="128" r="16" fill="#c6ff3d"/><text x="498" y="133" text-anchor="middle" fill="#07090a" font-size="14" font-weight="700">3</text><text x="488" y="174" fill="#f2f5f3" font-size="18" font-weight="700">Check why</text><text x="488" y="202" fill="#a3b0aa" font-size="13">Position, intent, demand</text><path d="M660 167h18m-7-7 7 7-7 7" fill="none" stroke="#c6ff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="686" y="96" width="142" height="142" rx="18" fill="#131917" stroke="#3c4b40"/><circle cx="716" cy="128" r="16" fill="#c6ff3d"/><text x="716" y="133" text-anchor="middle" fill="#07090a" font-size="14" font-weight="700">4</text><text x="706" y="174" fill="#f2f5f3" font-size="18" font-weight="700">Act once</text><text x="706" y="202" fill="#a3b0aa" font-size="13">Measure the fix</text></g></svg>
