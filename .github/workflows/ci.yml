name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go checks and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: uplumo_test
          POSTGRES_USER: uplumo
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uplumo -d uplumo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://uplumo:ci_test_password@localhost:5432/uplumo_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check module files
        working-directory: backend
        run: |
          go mod download
          go mod tidy
          git diff --exit-code -- backend/go.mod backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Static analysis
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Test with race detector and real Postgres and Redis
        working-directory: backend
        run: go test -p 1 -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check known vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Check dead code
        working-directory: backend
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          output="$(deadcode -test ./...)"
          test -z "$output" || { printf '%s\n' "$output"; exit 1; }

  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print Prettier's proposed billing page format
        run: |
          pnpm exec prettier --write src/client/features/billing/plan/BillingPlanPage.tsx
          git diff -- src/client/features/billing/plan/BillingPlanPage.tsx
      - name: Check frontend quality gates
        run: pnpm ci:check
      - name: Run frontend tests
        run: pnpm test
